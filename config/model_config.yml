# Protocolo PRELIMINAR reproducible. La CLI entrena solo con --run.
data:
  model_table: data/processed/preliminary/model_table.csv

protocol:
  reviewed: true  # Revisión técnica de viabilidad; no equivale a aprobación de la tesis.
  rationale: >-
    Evaluación exploratoria de casos de la misma campaña. La tabla curada contiene
    identificadores únicos y no declara lotes o réplicas. Se asume provisionalmente
    independencia entre registros; esa condición no se deduce de un identificador
    único. KFold barajado permite evaluar cada caso una vez y conserva suficientes
    observaciones en las particiones internas. La selección por MAE usa solo CV
    interna. No estima transferencia a otra campaña ni a familias geométricas
    inéditas; si se confirman dependencias debe repetirse con partición agrupada.
  strategy: kfold
  group_columns: []
  outer_splits: 5
  inner_splits: 3
  seed: 42

execution:
  allow_training: true
  n_jobs: 1

# Rejillas de partida, no hiperparámetros optimizados ni protocolo definitivo.
# Toda selección de familia e hiperparámetros ocurre en CV interna.
models:
  ridge:
    enabled: true
    grid:
      model__alpha: [0.1, 1.0, 10.0, 100.0]
  elastic_net:
    enabled: true
    grid:
      model__alpha: [0.01, 0.1, 1.0]
      model__l1_ratio: [0.1, 0.5, 0.9]
  support_vector:
    enabled: true
    grid:
      model__C: [0.1, 1.0, 10.0, 100.0]
      model__epsilon: [0.05, 0.1, 0.2]
      model__gamma: [scale, 0.1, 1.0]
  decision_tree:
    enabled: true
    grid:
      model__max_depth: [2, 3, null]
      model__min_samples_leaf: [2, 4]
  random_forest:
    enabled: true
    grid:
      model__max_depth: [2, 4, null]
      model__min_samples_leaf: [2, 4]
  gaussian_process:
    enabled: true
    grid:
      model__alpha: [0.000001, 0.001, 0.1]
  neural_network:
    enabled: false  # Habilitar solo con justificación sobre datos y complejidad
    grid:
      model__alpha: [0.001, 0.1, 1.0]

interpretation:
  permutation_enabled: true # Diagnóstico de sensibilidad; no selecciona el modelo.
  permutation_repeats: 10
