        <text x="450" y="221" text-anchor="middle">Primera rotura de una fibra o pivote</text>
        <text x="450" y="246" text-anchor="middle">¿Cuánta fuerza actúa en ese instante?</text><path d="M860 114 H892" stroke="#203345" stroke-width="2" fill="none"/><path d="M8 114 L20 108 L20 120 Z M892 114 L880 108 L880 120 Z" fill="#203345"/></g>
<text x="24" y="369" font-size="15" fill="#53616c">Esquema conceptual: geometría y rotura ilustrativas, sin escala ni fuerza calculada.</text>
<path d="M24 386 H876" stroke="#d4dce3"/>
<text x="24" y="421" font-weight="bold">INPUT · Antes del ensayo</text>
<text x="470" y="421" font-weight="bold">OUTPUT · Durante el ensayo</text>
<text x="24" y="457">• Dimensiones de las fibras.</text>
<text x="24" y="490">• Dimensiones y cantidad de pivotes.</text>
<text x="24" y="523">• Número de celdas y volúmenes.</text>
<text x="470" y="457">• Fuerzas: primera rotura y rotura final [N].</text>
<text x="470" y="490">• Desplazamientos [mm].</text>
<text x="470" y="523">• Energías [mJ].</text>
<path d="M24 551 H876" stroke="#d4dce3"/>
<text x="24" y="586" font-weight="bold">MODELO PROPUESTO</text>
<text x="24" y="618">Geometría conocida → Fuerza estimada de primera falla [N]</text>
<text x="24" y="648" font-size="15">Variable objetivo: First_Failure_Load_N</text>
</svg>
