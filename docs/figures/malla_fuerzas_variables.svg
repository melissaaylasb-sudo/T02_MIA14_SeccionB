<svg xmlns="http://www.w3.org/2000/svg" width="900" height="665" viewBox="0 0 900 665" role="img" aria-labelledby="titulo descripcion" font-family="Helvetica" font-size="18" fill="#203345">
<title id="titulo">Malla, tracción y variables de primera falla</title>
<desc id="descripcion">Esquema conceptual de fibras, pivotes y celdas. Flechas hacia afuera representan tracción y una cruz indica una rotura ilustrativa. INPUT: geometría conocida antes del ensayo. OUTPUT: fuerzas, desplazamientos y energías. El modelo propuesto estima la fuerza de primera falla en newtons.</desc>
<rect width="900" height="665" fill="#ffffff"/>
<text x="24" y="35" font-size="24" font-weight="bold">Una malla, una fuerza y una predicción</text>
<path d="M24 65 H52" stroke="#2563a6" stroke-width="5"/><text x="63" y="71">Fibra = barra</text>
<circle cx="303" cy="65" r="6" fill="#b67418"/><text x="320" y="71">Pivote = unión</text>
<path d="M593 57 L601 65 L593 73 L585 65 Z" fill="none" stroke="#203345"/><text x="617" y="71">Celda = espacio abierto</text>
<g transform="translate(0,88)">
        <title>Tracción de una malla pantográfica</title>
        <desc>Las barras son fibras, los puntos son pivotes y los espacios son celdas. La fuerza externa tiende a alargar la malla. La fuerza al aparecer la primera rotura es el objetivo del modelo.</desc>

        <text x="450" y="24" text-anchor="middle">TRACCIÓN = estirar hacia afuera</text>
